<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">

<!-- Black space background -->
<rect width="100%" height="100%" fill="#000000"/>


<!-- Blinking stars -->

<circle cx="100" cy="80" r="2" fill="white">
  <animate attributeName="opacity"
  values="1;0.2;1"
  dur="2s"
  repeatCount="indefinite"/>
</circle>

<circle cx="250" cy="150" r="3" fill="white">
  <animate attributeName="opacity"
  values="0.2;1;0.2"
  dur="3s"
  repeatCount="indefinite"/>
</circle>

<circle cx="800" cy="70" r="2" fill="white">
  <animate attributeName="opacity"
  values="1;0.1;1"
  dur="1.5s"
  repeatCount="indefinite"/>
</circle>

<circle cx="900" cy="220" r="3" fill="#8A2BE2">
  <animate attributeName="opacity"
  values="0.3;1;0.3"
  dur="2.5s"
  repeatCount="indefinite"/>
</circle>


<!-- Moving satellite -->

<g>
<text x="0" y="60" font-size="30">
🛰️
</text>

<animateTransform
attributeName="transform"
type="translate"
from="0 0"
to="900 100"
dur="8s"
repeatCount="indefinite"/>
</g>


<!-- Typing name -->

<text x="500" y="150"
fill="white"
font-size="55"
font-family="Arial"
font-weight="bold"
text-anchor="middle">

<tspan>
Vaishnavi Bharti
</tspan>

<animate
attributeName="opacity"
values="0;1"
dur="3s"
fill="freeze"/>

</text>


<!-- Subtitle -->

<text x="500" y="210"
fill="#AAAAAA"
font-size="25"
font-family="Arial"
text-anchor="middle">

Software Developer • AI • UX

<animate
attributeName="opacity"
values="0;1"
dur="4s"
fill="freeze"/>

</text>


</svg>
